{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NewsRadar{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'newsradar/icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'newsradar/css/app.css' %}">
</head>
<body
  class="min-h-screen bg-white text-slate-950 antialiased"
  data-page="{{ page }}"
  {% if content_id %}data-content-id="{{ content_id }}"{% endif %}
>
  <div id="app-shell" class="min-h-screen bg-white">
    <header class="nr-topbar">
      <a href="/" class="nr-brand" aria-label="NewsRadar home">
        <span class="nr-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" class="lucide lucide-radio">
            <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="nr-brand-copy">
          <span class="nr-brand-title">NewsRadar</span>
          <span class="nr-brand-subtitle">AGENDA MONITOR</span>
          <span id="sidebar-user-label" class="sr-only">Checking session...</span>
        </span>
      </a>

      <div id="auth-actions" class="nr-top-actions">
        <a href="/developer-access" class="nr-header-pill nr-api-pill">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15.4 7.6a3.7 3.7 0 1 1 1 1l-2.3 2.3h-2.3v2.3H9.5v2.3H7.2v2.3H4.9v-3.6l9.5-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M17.8 5.9h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          <span>API</span>
        </a>
        <span class="nr-top-divider" aria-hidden="true"></span>
        <button id="sign-in-button" type="button" class="nr-header-pill nr-sign-button">Sign in</button>
        <button id="sign-out-button" type="button" class="nr-header-pill nr-sign-button hidden">Sign out</button>
      </div>
    </header>

    <div class="nr-workspace">
      <aside class="nr-sidebar">
        <div class="nr-sidebar-body custom-scrollbar">
          <button id="add-topic-button" type="button" class="nr-add-topic">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 8.4v7.2M8.4 12h7.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Add Topic</span>
          </button>
          <div id="group-list" class="nr-group-list"></div>
        </div>
      </aside>

      <main class="nr-main">
      {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-4 left-1/2 z-50 hidden max-w-[calc(100vw-2rem)] -translate-x-1/2 rounded-lg border border-slate-200 bg-white px-4 py-3 text-sm text-slate-700 shadow-lg"></div>

  <div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <div class="modal-panel max-w-[420px] overflow-hidden p-0">
      <div class="h-2 bg-emerald-500"></div>
      <div class="space-y-6 p-8">
        <div class="space-y-3 text-center">
          <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-700">
            <svg viewBox="0 0 24 24" fill="none" width="24" height="24" class="lucide lucide-radio" aria-hidden="true">
              <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 id="auth-modal-title" class="text-2xl font-bold tracking-tight text-slate-900">Welcome to NewsRadar</h2>
          <p id="auth-modal-description" class="text-sm leading-6 text-slate-500">Enter your email to receive a magic sign-in link. No password required.</p>
        </div>
        <form id="auth-form" class="space-y-4">
          <div class="space-y-2">
            <label for="auth-email" class="text-xs font-bold uppercase tracking-wider text-slate-500">Email address</label>
            <input id="auth-email" name="email" type="email" required autocomplete="email" class="input h-12" placeholder="name@example.com">
          </div>
          <p id="auth-error" class="hidden text-center text-xs text-red-600"></p>
          <div class="flex gap-2">
            <button type="button" class="btn btn-outline flex-1" data-modal-close="auth-modal">Cancel</button>
            <button id="auth-submit" type="submit" class="btn btn-primary flex-1">Send magic link</button>
          </div>
        </form>
        <div id="auth-success" class="hidden space-y-4 text-center">
          <p class="text-base font-semibold text-slate-900">Check your inbox</p>
          <p id="auth-success-message" class="text-sm leading-6 text-slate-500"></p>
          <button id="auth-reset" type="button" class="btn btn-outline">Back to sign in</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="{% static 'newsradar/js/app.js' %}"></script>
</body>
</html>
